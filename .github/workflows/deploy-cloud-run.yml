name: Deploy FinSolve to Cloud Run

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      AR_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
      DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      HR_CSV_SECRET: ${{ vars.HR_DATA_CSV_SECRET }}
      APP_TOKEN_SECRET: ${{ vars.APP_TOKEN_SECRET }}
      VECTOR_TOKEN_SECRET: ${{ vars.VECTOR_TOKEN_SECRET }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      LLM_API_KEY_SECRET: ${{ vars.LLM_API_KEY_SECRET }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      STREAMLIT_RUNTIME_SERVICE_ACCOUNT: ${{ vars.STREAMLIT_RUNTIME_SERVICE_ACCOUNT }}
      ASSISTANT_RUNTIME_SERVICE_ACCOUNT: ${{ vars.ASSISTANT_RUNTIME_SERVICE_ACCOUNT }}
      VECTOR_RUNTIME_SERVICE_ACCOUNT: ${{ vars.VECTOR_RUNTIME_SERVICE_ACCOUNT }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in PROJECT_ID REGION AR_REPOSITORY DEPLOYER_SERVICE_ACCOUNT \
            HR_CSV_SECRET APP_TOKEN_SECRET VECTOR_TOKEN_SECRET LLM_PROVIDER \
            LLM_API_KEY_SECRET LLM_MODEL STREAMLIT_RUNTIME_SERVICE_ACCOUNT \
            ASSISTANT_RUNTIME_SERVICE_ACCOUNT VECTOR_RUNTIME_SERVICE_ACCOUNT; do
            if [[ -z "${!name}" ]]; then
              echo "Required GitHub Actions variable is missing: $name" >&2
              exit 1
            fi
          done
          case "${LLM_PROVIDER,,}" in
            groq|gemini) ;;
            *)
              echo "LLM_PROVIDER must be groq or gemini." >&2
              exit 1
              ;;
          esac

      - name: Build and push Vector API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: vector_service/Dockerfile
          push: true
          tags: |
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/vector-api:${{ github.sha }}
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/vector-api:main
          cache-from: type=gha,scope=vector-api
          cache-to: type=gha,scope=vector-api,mode=max

      - name: Retrieve HR CSV build secret
        shell: bash
        run: |
          set -euo pipefail
          gcloud secrets versions access latest \
            --secret="${HR_CSV_SECRET}" \
            --project="${PROJECT_ID}" \
            > "${RUNNER_TEMP}/hr_data.csv"
          chmod 600 "${RUNNER_TEMP}/hr_data.csv"

      - name: Build and push Assistant API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app_api/Dockerfile
          push: true
          tags: |
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/assistant-api:${{ github.sha }}
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/assistant-api:main
          secret-files: |
            hr_data_csv=${{ runner.temp }}/hr_data.csv

      - name: Remove temporary HR CSV
        if: always()
        run: rm -f "${RUNNER_TEMP}/hr_data.csv"

      - name: Build and push Streamlit
        uses: docker/build-push-action@v6
        with:
          context: .
          file: streamlit_app/Dockerfile
          push: true
          tags: |
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/streamlit:${{ github.sha }}
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/streamlit:main
          cache-from: type=gha,scope=streamlit
          cache-to: type=gha,scope=streamlit,mode=max

      - name: Deploy Vector API, Assistant API, and Streamlit
        shell: bash
        run: |
          set -euo pipefail
          registry="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}"
          vector_image="${registry}/vector-api:${GITHUB_SHA}"
          assistant_image="${registry}/assistant-api:${GITHUB_SHA}"
          streamlit_image="${registry}/streamlit:${GITHUB_SHA}"

          gcloud run deploy vector-api \
            --image="${vector_image}" \
            --region="${REGION}" \
            --platform=managed \
            --service-account="${VECTOR_RUNTIME_SERVICE_ACCOUNT}" \
            --no-allow-unauthenticated \
            --set-env-vars="VECTOR_TOKEN_ISSUER=finsolve-app-api,VECTOR_TOKEN_AUDIENCE=finsolve-vector-api" \
            --set-secrets="VECTOR_TOKEN_SECRET=${VECTOR_TOKEN_SECRET}:latest"
          vector_url="$(gcloud run services describe vector-api \
            --region="${REGION}" --format='value(status.url)')"

          llm_provider="${LLM_PROVIDER,,}"
          llm_model_env="GROQ_MODEL"
          llm_key_env="GROQ_API_KEY"
          if [[ "${llm_provider}" == "gemini" ]]; then
            llm_model_env="GEMINI_MODEL"
            llm_key_env="GOOGLE_API_KEY"
          fi

          gcloud run deploy assistant-api \
            --image="${assistant_image}" \
            --region="${REGION}" \
            --platform=managed \
            --service-account="${ASSISTANT_RUNTIME_SERVICE_ACCOUNT}" \
            --no-allow-unauthenticated \
            --set-env-vars="FIREBASE_PROJECT_ID=${PROJECT_ID},FIREBASE_USE_APPLICATION_DEFAULT_CREDENTIALS=true,CLOUD_RUN_IAM_AUTH=true,VECTOR_SEARCH_MODE=remote,VECTOR_SERVICE_URL=${vector_url},VECTOR_TOKEN_ISSUER=finsolve-app-api,VECTOR_TOKEN_AUDIENCE=finsolve-vector-api,LLM_PROVIDER=${llm_provider},${llm_model_env}=${LLM_MODEL}" \
            --set-secrets="APP_TOKEN_SECRET=${APP_TOKEN_SECRET}:latest,VECTOR_TOKEN_SECRET=${VECTOR_TOKEN_SECRET}:latest,${llm_key_env}=${LLM_API_KEY_SECRET}:latest"
          assistant_url="$(gcloud run services describe assistant-api \
            --region="${REGION}" --format='value(status.url)')"

          gcloud run services add-iam-policy-binding vector-api \
            --region="${REGION}" \
            --member="serviceAccount:${ASSISTANT_RUNTIME_SERVICE_ACCOUNT}" \
            --role="roles/run.invoker" \
            --quiet
          gcloud run services add-iam-policy-binding assistant-api \
            --region="${REGION}" \
            --member="serviceAccount:${STREAMLIT_RUNTIME_SERVICE_ACCOUNT}" \
            --role="roles/run.invoker" \
            --quiet

          gcloud run deploy streamlit \
            --image="${streamlit_image}" \
            --region="${REGION}" \
            --platform=managed \
            --service-account="${STREAMLIT_RUNTIME_SERVICE_ACCOUNT}" \
            --allow-unauthenticated \
            --set-env-vars="ASSISTANT_API_MODE=real,ASSISTANT_API_URL=${assistant_url},CLOUD_RUN_IAM_AUTH=true"
