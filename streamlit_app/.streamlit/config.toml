# Copy to <app folder>/.streamlit/config.toml
[theme]
base = "dark"
primaryColor = "#00F0FF"
backgroundColor = "#0A0A0A"
secondaryBackgroundColor = "#121214"
textColor = "#F4F4F5"
font = "sans serif"

[server]
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showSidebarNavigation = false
